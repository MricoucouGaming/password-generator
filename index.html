<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur de mot de passe</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #09090b;
    --surface: #111113;
    --border: #222226;
    --accent: #22d3ee;
    --accent2: #a78bfa;
    --text: #f4f4f5;
    --muted: #71717a;
    --danger: #f87171;
    --warn: #fbbf24;
    --ok: #4ade80;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 520px;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 0.25rem;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 2rem;
  }

  /* Password display */
  .pwd-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  #pwd-output {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    flex: 1;
    word-break: break-all;
    color: var(--accent);
    letter-spacing: 0.05em;
    min-height: 1.4em;
  }

  .btn-icon {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    padding: 6px 8px;
    font-size: 1rem;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .btn-icon:hover { color: var(--text); border-color: var(--accent); }

  /* Strength bar */
  .strength-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.75rem;
  }
  .strength-bars {
    display: flex;
    gap: 4px;
    flex: 1;
  }
  .bar {
    flex: 1;
    height: 4px;
    border-radius: 4px;
    background: var(--border);
    transition: background 0.3s;
  }
  #strength-label {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    min-width: 60px;
    text-align: right;
  }

  /* Slider */
  .option-row {
    margin-bottom: 1.25rem;
  }
  .option-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }
  .option-label span { color: var(--text); font-weight: 700; }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 4px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    cursor: pointer;
    transition: transform 0.15s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }

  /* Toggles */
  .toggles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
    margin-bottom: 2rem;
  }

  .toggle-item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s;
    font-size: 0.82rem;
  }
  .toggle-item:hover { border-color: var(--muted); }
  .toggle-item.active { border-color: var(--accent); color: var(--accent); }

  .toggle-item input { display: none; }

  .checkmark {
    width: 14px;
    height: 14px;
    border: 1.5px solid var(--muted);
    border-radius: 3px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    transition: all 0.15s;
  }
  .toggle-item.active .checkmark {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
  }

  /* Buttons */
  .btn-main {
    width: 100%;
    padding: 0.9rem;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--bg);
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-main:hover { opacity: 0.9; }
  .btn-main:active { transform: scale(0.98); }

  .copy-toast {
    text-align: center;
    font-size: 0.8rem;
    color: var(--ok);
    margin-top: 0.75rem;
    height: 1.2em;
    transition: opacity 0.3s;
  }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Générateur</h1>
  <p class="subtitle">Crée des mots de passe forts en un clic</p>

  <div class="pwd-box">
    <div id="pwd-output">Clique sur Générer</div>
    <button class="btn-icon" id="btn-copy" title="Copier">📋</button>
    <button class="btn-icon" id="btn-refresh" title="Regénérer">🔄</button>
  </div>

  <div class="strength-row">
    <div class="strength-bars">
      <div class="bar" id="b1"></div>
      <div class="bar" id="b2"></div>
      <div class="bar" id="b3"></div>
      <div class="bar" id="b4"></div>
    </div>
    <div id="strength-label" style="color: var(--muted);">—</div>
  </div>

  <div class="option-row">
    <div class="option-label">Longueur <span id="len-val">16</span></div>
    <input type="range" id="length" min="6" max="64" value="16" step="1">
  </div>

  <div class="toggles">
    <label class="toggle-item active" id="lbl-maj">
      <input type="checkbox" id="maj" checked>
      <span class="checkmark">✓</span>
      Majuscules
    </label>
    <label class="toggle-item active" id="lbl-min">
      <input type="checkbox" id="min" checked>
      <span class="checkmark">✓</span>
      Minuscules
    </label>
    <label class="toggle-item active" id="lbl-num">
      <input type="checkbox" id="num" checked>
      <span class="checkmark">✓</span>
      Chiffres
    </label>
    <label class="toggle-item active" id="lbl-sym">
      <input type="checkbox" id="sym" checked>
      <span class="checkmark">✓</span>
      Symboles
    </label>
  </div>

  <button class="btn-main" id="btn-gen">Générer un mot de passe</button>
  <div class="copy-toast" id="toast"></div>
</div>

<script>
  const CHARS = {
    maj: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    min: 'abcdefghijklmnopqrstuvwxyz',
    num: '0123456789',
    sym: '!@#$%^&*()_+-=[]{}|;:,.<>?'
  };

  const $ = id => document.getElementById(id);
  const lenSlider = $('length');
  const lenVal = $('len-val');
  const output = $('pwd-output');
  const toast = $('toast');

  lenSlider.addEventListener('input', () => {
    lenVal.textContent = lenSlider.value;
    generate();
  });

  ['maj','min','num','sym'].forEach(id => {
    $('lbl-' + id).addEventListener('click', () => {
      const cb = $(id);
      // Toggle checkbox manually since label click is handled
      setTimeout(() => {
        const lbl = $('lbl-' + id);
        const chk = $(id);
        if (chk.checked) {
          lbl.classList.add('active');
          lbl.querySelector('.checkmark').textContent = '✓';
        } else {
          lbl.classList.remove('active');
          lbl.querySelector('.checkmark').textContent = '';
        }
        generate();
      }, 0);
    });
  });

  function getCharset() {
    let c = '';
    if ($('maj').checked) c += CHARS.maj;
    if ($('min').checked) c += CHARS.min;
    if ($('num').checked) c += CHARS.num;
    if ($('sym').checked) c += CHARS.sym;
    return c;
  }

  function generate() {
    const charset = getCharset();
    if (!charset) { output.textContent = 'Sélectionne au moins un type'; return; }
    const len = parseInt(lenSlider.value);
    const arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    let pwd = '';
    // Garantir au moins un caractère de chaque type actif
    const types = ['maj','min','num','sym'].filter(id => $(id).checked);
    const forced = types.map(id => {
      const c = CHARS[id];
      const idx = crypto.getRandomValues(new Uint8Array(1))[0] % c.length;
      return c[idx];
    });
    // Remplir le reste
    const rest = Array.from({length: len - forced.length}, (_, i) => {
      return charset[arr[i] % charset.length];
    });
    // Mélanger
    const all = [...forced, ...rest];
    for (let i = all.length - 1; i > 0; i--) {
      const j = crypto.getRandomValues(new Uint8Array(1))[0] % (i + 1);
      [all[i], all[j]] = [all[j], all[i]];
    }
    pwd = all.join('');
    output.textContent = pwd;
    updateStrength(pwd, charset.length);
  }

  function updateStrength(pwd, charsetSize) {
    const entropy = pwd.length * Math.log2(charsetSize);
    const bars = [$('b1'),$('b2'),$('b3'),$('b4')];
    const label = $('strength-label');
    bars.forEach(b => b.style.background = 'var(--border)');

    let level, color, text;
    if (entropy < 40) { level=1; color='var(--danger)'; text='FAIBLE'; }
    else if (entropy < 60) { level=2; color='var(--warn)'; text='MOYEN'; }
    else if (entropy < 80) { level=3; color='#34d399'; text='FORT'; }
    else { level=4; color='var(--ok)'; text='TRÈS FORT'; }

    for (let i=0; i<level; i++) bars[i].style.background = color;
    label.style.color = color;
    label.textContent = text;
  }

  $('btn-gen').addEventListener('click', generate);
  $('btn-refresh').addEventListener('click', generate);

  $('btn-copy').addEventListener('click', () => {
    const pwd = output.textContent;
    if (!pwd || pwd.includes('Sélectionne') || pwd.includes('Clique')) return;
    navigator.clipboard.writeText(pwd).then(() => {
      toast.textContent = '✅ Copié dans le presse-papier !';
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.textContent='', 400); }, 2000);
    });
  });

  generate();
</script>
</body>
</html>
